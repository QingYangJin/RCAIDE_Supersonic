schema_version: dreal001.meta_train_config.v1
status: DRAFT_PENDING_M0_GO
not_authorization: true
physical_call_count: 0
ready_for_real_meta_training: false
method:
  default: fomaml
  allowed:
  - fomaml
  - supervised_pretrain_plus_adapt
  full_maml:
    enabled: false
    reason: second-order graph/memory gate not passed; allow_second_order=false
  first_order: true
seeds:
  split: 42
  model_init: 42
  episode_sampling: 42
  adaptation: 42
  bo: 42
  pilot_seed_count: 1
  inferential_statistics: DISABLED
  note: single-seed pilot is descriptive only; no p-values/CI/winner
model:
  design_dim: 12
  context_dim: 20
  input_dim: 32
  output_dim: 2
  hidden_sizes:
  - 64
  - 64
  activation: relu
  context_encoder:
    class: TaskContextEncoder
    feature_names: &id001
    - mask_W01
    - mask_W02
    - mask_W03
    - mask_W04
    - mask_W05
    - mask_W06
    - mask_W07
    - mask_W08
    - mask_W09
    - mask_W10
    - mask_V01
    - mask_V02
    - mach
    - altitude_km
    - lift_reference_MN
    - lift_tol_rel
    - log10_q_Pa
    - alpha_min_deg
    - alpha_max_deg
    - n_active_design_dims
    mask_policy: EXPLICIT_MASK_BITS_IN_CONTEXT_ENCODER
    fit_split: meta_train
  design_mask:
    active_mask:
    - true
    - true
    - true
    - true
    - true
    - true
    - true
    - true
    - true
    - true
    - true
    - true
    inactive_dimensions: []
    label: ALL_12_ACTIVE
optimization:
  inner_lr: 0.01
  inner_steps: 5
  outer_lr: 0.001
  meta_batch_tasks: 4
  meta_steps: 20
  batch_size: 4
  optimizer: adam
  weight_decay: 0.0
  grad_clip: null
  deterministic: true
  torch_num_threads: 1
  device: cpu
  checkpoint_every: 10
  checkpoint_dir: docs/evidence/dreal001/t0_4_20261113/checkpoints
adaptation:
  k_shot:
  - 0
  - 1
  - 3
  - 5
  k0_semantics: no support adaptation; evaluate the model prior
  support_size: 8
  query_size: 8
  adaptation_steps: 5
  adaptation_lr: 0.01
  support_query_disjoint: true
  query_labels_visible_to_adaptation: false
baselines:
  supervised_pretrain_plus_adapt:
    enabled: true
    description: same MLP trained on pooled meta_train labels only, then same K-shot
      inner-loop adaptation
    epochs: 20
    learning_rate: 0.001
    batch_size: 16
    weight_decay: 0.0
    adaptation_matches_fomaml: true
  zero_shot:
    enabled: true
    description: K=0 for each method; no support labels used
  random_search:
    enabled: false
    reason: not part of the T0-4 pilot; M0 may add it with separate budget
backend:
  bo:
    enabled: true
    role: PRIMARY_FOR_M3B_AND_OPTIMIZATION_BACKEND
    in_t0_4_pilot: false
    reason: M3-A first pilot uses fixed support/query designs to avoid adaptive-selection
      bias; M3-B BO warm-start needs its own budget after M0
  de:
    enabled: false
  pso:
    enabled: false
data_usage:
  meta_train_tasks: 4
  meta_val_tasks: 2
  meta_test_tasks: 3
  labels_per_task: 16
  support_per_task: 8
  query_per_task: 8
  meta_train_labels: 64
  meta_val_labels: 32
  meta_test_labels: 48
  meta_val_usage: early stopping / method selection only; never training
  meta_test_usage: heldout K-shot scoring only after model and config are frozen
  preflight_rows_excluded: true
cost_accounting:
  separate_phases:
  - TRAIN
  - ADAPT
  - INFERENCE
  - DATA_COLLECTION
  charged_vs_actual: separate columns; never mixed
  physical_solver_starts_train: 0
  physical_solver_starts_adapt: 0
  physical_solver_starts_inference: 0
  gpu_required: false
  max_host_memory_mb: 2048
  note: all T0-4 training/adaptation/inference is zero-physical; label collection
    cost is charged to M1/M3 separately
statistics_endpoints:
  primary:
  - query_MAE of objective_Di_N per (method, K, task)
  - query_RMSE of objective_Di_N per (method, K, task)
  - K_shot_gain(K) = 1 - MAE(method,K)/MAE(method,K=0) per task (descriptive)
  - negative_transfer flag when K>0 MAE is worse than K=0 by >5% (pre-registered descriptive
    flag)
  secondary:
  - Spearman rank correlation of predicted vs measured query objective
  - invalid/feasibility counts
  - physical starts and internal cases per task
  forbidden:
  - winner declaration
  - p-values/CI/significance on a single seed
  - cross-family absolute comparison
  - fuel_burn_kg claims
  - external physics validation claims
  pilot_interpretation: descriptive only; n=3 heldout tasks and one seed cannot support
    inferential claims
a2_binding:
  package: research/concorde_metaopt/dreal001/meta (A2-owned T0-3)
  imports_a3_tree: false
  protocol: duck-typed EvaluationRecordProtocol / Sequence[task_episodes]
  model_factory: make_model
  model_kwargs:
    design_dim: 12
    context_names: *id001
    output_dim: 2
    hidden_sizes:
    - 64
    - 64
    inner_lr: 0.01
    inner_steps: 5
    outer_lr: 0.001
    tasks_per_batch: 4
    seed: 42
  train_config:
    method: fomaml
    max_steps: 20
    batch_size: 4
    seed: 42
    checkpoint_every: 10
    allow_second_order: false
    max_second_order_mb: 512
    pretrain_learning_rate: 0.01
    weight_decay: 0.0
    grad_clip: null
  calls:
    train: MetaTrainer.train(task_episodes, model, TrainConfig)
    adapt: AdaptationRunner.adapt(support, k_shot, context, seed, design_space)
    warm_start: WarmStartSampler.propose(context, design_space, observed_support,
      n_new, seed)
  note: A2 may change its own internals; this file is a DRAFT interface check, not
    an A2 code change.
a1_binding:
  evaluator_id: dreal001.evaluator.v12.fixed_cruise
  evaluator_code_sha256: f74a4752495fd6c5330edcaf7edb4bcbe93f99c2a76bac06b5670d1f765ae20d
  geometry_id: CFG-01-thin-12x25-production-baseline
  geometry_sha256: 40fdd4364e01c7fe11ca2ea4530d39c371ae693a434f39e44986f7512d6446f4
  solver_version: 7.2.2
  openvsp_version: 3.55.0
  objective: minimize D_i_N at matched lift; meta target = 0.5*CDi(f1)+0.5*CDi(f2)
stop_conditions:
- any preflight FAIL -> abort batch; no retry
- per-task invalid ratio >25% after >=8 evaluations -> stop that task
- batch invalid ratio >20% after >=24 evaluations -> abort batch
- two consecutive INFRA errors -> abort
- free disk <20 GB -> abort
- wall cap exceeded -> stop remaining evaluations, keep completed records
- any authorization/token mismatch -> refuse to start
promotion_gate:
  ready_for_real_meta_training: false
  requires:
  - T0-4 artifacts reviewed by A5
  - per-task real applicability evidence from M0/M1
  - M0 freeze
  - new Lead authorization
  - preflight 2/2 PASS
non_result_boundary:
  physical_validation_status: NOT_VALIDATED
  fuel_burn_kg: null
  external_physics_supported: NOT_VALIDATED
  winner_or_significance: NONE
