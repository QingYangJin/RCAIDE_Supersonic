  issue: "#4 METAOPT-P1-P3 (D-12D-001)"
  baseline_file: tutorials/Simulation_Turbojet_Supersonic_Aircraft_4500nmi_Mission/Concorde.py
  baseline_sha256: 4c633e485a915151faaa8104e6647f9dc02bd08ae1436c22845e5917b3d735bd
  notes: Lifting-surface variables and numeric bounds are inherited unchanged from the 15D contract; the fuselage is fixed, not deleted, and remains visible in baseline_geometry and fixed_variables. Supersonic low-fidelity and high-fidelity evidence for this set is NOT VALIDATED (see review-12d-supersonic-feasibility-20261030T1555).

