# Concorde - 12D lifting-surface design space (D-12D-001, Issue #4 P1 section 3)
# Status: PROPOSED FOR OWNER APPROVAL. The 12 declared variables are W01-W10 (main wing)
# plus V01-V02 (vertical tail). The fuselage F01-F03 are FIXED at the computed
# geometry-model values (owner decision, 2026-10-30) and are recorded under
# fixed_variables. The legacy 15D config and every archived 15D result are kept
# unchanged and must not be treated as 12D evidence.
#
# This file is data only: loading it runs no physics and evaluates no objective.
schema_version: "1"
stage: P1
task_id: concorde_fixed_cruise_12d
design_set: 12d_lifting_surfaces
units: SI
frozen: false
bounds_status: provisional_until_geometry_perturbation
freeze_requires:
  - geometry effect matrix over the 12 declared lifting-surface variables (P1-P3)
  - derived-quantity recomputation checked against RCAIDE geometry for the 12D set
  - owner approval of the frozen bounds and of the fixed fuselage geometry source

