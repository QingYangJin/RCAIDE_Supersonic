# Frozen single-cruise task contract for the Concorde Phase I optimisation.
# All values are SI: m, kg, dimensionless Mach and m for distance.
#
# Mass-contract provenance (measured 2026-10-29, RCAIDE single-cruise mission
# evaluation on the P1 geometry model, 60000 ft and Mach 2.02 over 1635 nmi):
#   start 185000 kg -> max_throttle 1.2708  (INFEASIBLE, the old app failure)
#   start 155000 kg -> max_throttle 1.0374  (infeasible)
#   start 150000 kg -> max_throttle 1.0008  (infeasible)
#   start 145000 kg -> max_throttle 1.0163  (infeasible with the P1 geometry)
#   start 136000 kg -> max_throttle 0.9455  (feasible, measured)
# The 145000 kg point was extrapolated from the tutorial geometry, whose root
# chord (33.8 m) differs from the P1 planform closure (29.90 m); once the P2
# adapter drives the real P1 geometry the 145 t contract is no longer feasible.
# 136000 kg with 46800 kg loaded fuel (zero-fuel mass 89200 kg) is therefore the
# frozen Phase I contract: about a 5.5 percent baseline throttle margin so the
# baseline is feasible and the optimiser can trade fuel burn against geometry.
# It is NOT an MTOW mission; it is the fixed cruise-entry state the Issue asks for.
