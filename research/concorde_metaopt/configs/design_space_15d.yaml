derived_rules:
  - name: projected_span
    formula: sqrt(wing_area * aspect_ratio)
    note: section span fractions stay fixed and are applied to this span.
  - name: wing_root_chord
    formula: K = sum(0.5 * delta_s_i * (r_i + r_i+1)); root_chord = wing_area / (projected_span * K) with fixed chord ratios [1.0, chord_ratio_2, chord_ratio_3, 0.032544]
    note: the single-trapezoid formula from the first P1 draft is withdrawn; it derived 27.10 m against the upstream declaration 33.8 m. Six generated configurations must be checked in P1.
  - name: wing_tip_chord
    formula: tip_chord = root_chord * 0.032544
    note: the upstream tip/root ratio is preserved; tip chord therefore scales with the root chord.
  - name: wing_wetted_area
    formula: sum(2.003 * exposed_segment_area) over the four sections (thickness_to_chord 0.03 < 0.05)
    note: no placeholder 601/358.25 ratio remains.
  - name: wing_exposed_area
    formula: equals the reference area in P1
    note: the fuselage-unexposed span is not modelled; the upstream declaration 326.5 m2 is an unresolved cross-check for P2, not a frozen value.
  - name: vertical_tail_span
    formula: sqrt(vertical_tail_area * 0.74)
    note: tail aspect ratio held at 0.74; tail sweep delta V02 applies to all three tail sections. RCAIDE forces the last segment sweep to the previous segment, so the RCAIDE tip sweep is 40 deg while the model tip sweep is 0 deg at baseline.
  - name: vertical_tail_root_chord
    formula: K = sum(0.5 * delta_s_i * (r_i + r_i+1)); root_chord = vertical_tail_area / (tail_span * K) with fixed chord ratios [1.0, 0.517241, 0.186207]
    note: the derived baseline tail span 5.009331 m differs from the upstream declared 6.0 m; this deviation must be resolved before the design space is frozen.
  - name: fuselage_geometry
    formula: nose_length = fineness_nose * width; tail_length = nose_length * 6.4 / 4.3; cabin_length = length - nose_length - tail_length; height = fuselage_height_width_ratio * 2.88; wetted area and usable volume from the eight elliptic-cone stations
    note: width is held at 2.88 m; usable volume must stay at or above the required 110 m3.
  - name: mass_and_cg
    formula: PROVISIONAL_NOT_FROZEN
    note: upstream operating empty mass 78700 kg is distributed over component classes and scaled with wing area and fuselage length; CG and static margin are diagnostics only and must not be used as a frozen constraint before P2 TaskSpec approval.

cross_constraints:
  - id: C01
    expression: span_location_2 < span_location_3
    note: wing breakpoints must stay ordered.
  - id: C02
    expression: chord_ratio_3 < chord_ratio_2 < 1.0
    note: chord stays positive and monotonically decreasing outboard.
  - id: C03
    expression: 0 < wing_area, 0 < aspect_ratio, 0 < vertical_tail_area, 0 < fuselage_length
    note: positive geometric quantities.
  - id: C04
    expression: 0 <= sweep_1, sweep_2, sweep_3 <= 90
    note: sweep sanity range in degrees.

evaluation_target:
  objective: fuel_burn_kg
  definition: mass_start_kg - mass_end_kg for one fixed supersonic cruise segment
  status: not_frozen
  note: TaskSpec, cruise Mach/altitude/range and propulsion contract are P2 deliverables.
