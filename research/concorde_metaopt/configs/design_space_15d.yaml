# Concorde Phase I - 15D design space (P1 deliverable)
# Status: provisional bounds. Order and identifiers are frozen by Issue #1 section 2 P1;
# numeric bounds are engineering placeholders until the P1 perturbation / geometry-effect
# matrix replaces them with measured shrinkage limits.
schema_version: "1"
stage: P1
task_id: concorde_fixed_cruise_15d
units: SI
frozen: false
bounds_status: provisional_until_geometry_perturbation
freeze_requires:
  - geometry effect matrix over all 15 variables (P1)
  - derived-quantity recomputation checked against RCAIDE geometry (P1)
  - user approval of the frozen bounds

source:
  issue: "#1 METAOPT-00"
  baseline_file: tutorials/Simulation_Turbojet_Supersonic_Aircraft_4500nmi_Mission/Concorde.py
  baseline_sha256: 4c633e485a915151faaa8104e6647f9dc02bd08ae1436c22845e5917b3d735bd
  notes: Baseline numbers were read from the tutorial file; they are not a frozen TaskSpec.

variables:
  - id: W01
    name: wing_area
    unit: m^2
    baseline: 358.25
    lower: 300.0
    upper: 420.0
    scale: 100.0
    target: main_wing.areas.reference
  - id: W02
    name: aspect_ratio
    unit: dimensionless
    baseline: 1.83
    lower: 1.50
    upper: 2.20
    scale: 1.0
    target: main_wing.aspect_ratio
  - id: W03
    name: sweep_1
    unit: deg
    baseline: 67.0
    lower: 62.0
    upper: 72.0
    scale: 10.0
    target: main_wing.segments.section_1.sweeps.quarter_chord
  - id: W04
    name: sweep_2
    unit: deg
    baseline: 48.0
    lower: 40.0
    upper: 56.0
    scale: 10.0
    target: main_wing.segments.section_2.sweeps.quarter_chord
  - id: W05
    name: sweep_3
    unit: deg
    baseline: 71.0
    lower: 66.0
    upper: 76.0
    scale: 10.0
    target: main_wing.segments.section_3.sweeps.quarter_chord
  - id: W06
    name: span_location_2
    unit: dimensionless
    baseline: 0.480469
    lower: 0.35
    upper: 0.58
    scale: 0.1
    target: main_wing.segments.section_2.percent_span_location
  - id: W07
    name: span_location_3
    unit: dimensionless
    baseline: 0.945313
    lower: 0.85
    upper: 0.98
    scale: 0.1
    target: main_wing.segments.section_3.percent_span_location
  - id: W08
    name: chord_ratio_2
    unit: dimensionless
    baseline: 0.408284
    lower: 0.30
    upper: 0.50
    scale: 0.1
    target: main_wing.segments.section_2.root_chord_percent
  - id: W09
    name: chord_ratio_3
    unit: dimensionless
    baseline: 0.130178
    lower: 0.08
    upper: 0.20
    scale: 0.1
    target: main_wing.segments.section_3.root_chord_percent
  - id: W10
    name: tip_twist
    unit: deg
    baseline: 0.0
    lower: -4.0
    upper: 4.0
    scale: 5.0
    target: main_wing.segments.tip.twist
  - id: V01
    name: vertical_tail_area
    unit: m^2
    baseline: 33.91
    lower: 28.0
    upper: 40.0
    scale: 10.0
    target: vertical_stabilizer.areas.reference
  - id: V02
    name: vertical_tail_sweep_delta
    unit: deg
    baseline: 0.0
    lower: -10.0
    upper: 10.0
    scale: 10.0
    target: vertical_stabilizer.quarter_chord_sweep_delta
  - id: F01
    name: fuselage_length
    unit: m
    baseline: 61.66
    lower: 58.0
    upper: 66.0
    scale: 5.0
    target: fuselage.lengths.total
  - id: F02
    name: fuselage_fineness
    unit: dimensionless
    baseline: 4.30
    lower: 3.60
    upper: 5.20
    scale: 1.0
    target: fuselage.fineness.nose
  - id: F03
    name: fuselage_height_width_ratio
    unit: dimensionless
    baseline: 1.152778
    lower: 1.00
    upper: 1.35
    scale: 0.2
    target: fuselage.heights.maximum_over_width

baseline_geometry:
  main_wing:
    projected_span_m: 25.6
    root_chord_m: 33.8
    tip_chord_m: 1.1
    taper_ratio: 0.032544
    wetted_area_m2: 601.0
    exposed_area_m2: 326.5
    section_1_root_chord_percent: 1.0
    span_location_2_base: 0.480469
    span_location_3_base: 0.945313
  vertical_stabilizer:
    projected_span_m: 6.0
    root_chord_m: 14.5
    tip_chord_m: 2.7
    taper_ratio: 0.186207
    wetted_area_m2: 76.0
    section_sweeps_deg: [63.0, 40.0, 0.0]
  fuselage:
    length_m: 61.66
    width_m: 2.88
    height_m: 3.32
    nose_fineness: 4.3
    tail_fineness: 6.4
    wetted_area_m2: 442.0

derived_rules:
  - name: projected_span
    formula: sqrt(wing_area * aspect_ratio)
    note: replaces the hard-coded 25.6 m span; section span fractions are applied to this span.
  - name: wing_chords
    formula: taper_ratio = tip_chord_root_chord_ratio; root_chord = 2 * wing_area / (span * (1 + taper_ratio)); tip_chord = taper_ratio * root_chord
    note: taper ratio is held at the baseline value until a dedicated variable is approved.
  - name: wing_wetted_area
    formula: baseline_wetted_over_reference_ratio * wing_area
    note: placeholder ratio 601/358.25; must be replaced by a geometry-derived value in P1.
  - name: vertical_tail_span
    formula: sqrt(vertical_tail_area * baseline_tail_aspect_ratio)
    note: tail aspect ratio held at 0.74; tail sweep deltas apply to all three tail sections.
  - name: fuselage_height
    formula: fuselage_height_width_ratio * baseline_width
    note: width held at 2.88 m; height ratio replaces the three hard-coded 3.32 m values.
  - name: fuselage_tail_fineness
    formula: fuselage_fineness * baseline_tail_over_nose_ratio
    note: tail fineness keeps the baseline 6.4 / 4.3 ratio.
  - name: mass_and_cg
    formula: NOT_IMPLEMENTED
    note: mass/CG scaling and nacelle/landing-gear attachment updates are still open; no fuel-burn conclusion may use a hard-coded mass.

cross_constraints:
  - id: C01
    expression: span_location_2 < span_location_3
    note: wing breakpoints must stay ordered.
  - id: C02
    expression: chord_ratio_3 < chord_ratio_2 < 1.0
    note: chord stays positive and monotonically decreasing outboard.
  - id: C03
    expression: 0 < wing_area, 0 < vertical_tail_area, 0 < fuselage_length
    note: positive geometric quantities.
  - id: C04
    expression: 0 <= sweep_1, sweep_2, sweep_3 <= 90
    note: sweep sanity range in degrees.

evaluation_target:
  objective: fuel_burn_kg
  definition: mass_start_kg - mass_end_kg for one fixed supersonic cruise segment
  status: not_frozen
  note: TaskSpec, cruise Mach/altitude/range and propulsion contract are P2 deliverables.
