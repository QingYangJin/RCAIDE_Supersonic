# Concorde Phase I - 15D design space (P1 deliverable)
# Status: provisional bounds. Order and identifiers are frozen by Issue #1 section 2 P1;
# numeric bounds are engineering placeholders until the P1 perturbation / geometry-effect
# matrix replaces them with measured shrinkage limits.
schema_version: "1"
stage: P1
task_id: concorde_fixed_cruise_15d
units: SI
frozen: false
bounds_status: provisional_until_geometry_perturbation
freeze_requires:
  - geometry effect matrix over all 15 variables (P1)
  - derived-quantity recomputation checked against RCAIDE geometry (P1)
  - user approval of the frozen bounds

